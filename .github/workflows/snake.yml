name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Fetoooo
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#BB9AF7&color_dots=#16161E,#24283B,#7AA2F7,#9D7CD8,#BB9AF7
            dist/github-contribution-grid-snake-dark.svg?color_snake=#BB9AF7&color_dots=#16161E,#24283B,#7AA2F7,#9D7CD8,#BB9AF7

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
